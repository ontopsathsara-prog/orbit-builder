<script>
const GEMINI_KEY = "AQ.Ab8RN6J8zs5TSBfwsgel_7hg8Qf29bqpy8y0LQ7kTQttFup1eQ"; // <-- oya key eka meke paste karanna

function setP(t){document.getElementById('prompt').value=t;build()}

async function build(){
 let p = document.getElementById('prompt').value;
 if(!p) return alert('Prompt ekak danna bm!');
 let result = document.getElementById('result');
 result.style.display='block';
 document.getElementById('logs').innerHTML = "🤖 AI thinking...<br>Connecting to Gemini...";
 window.scrollTo(0,document.body.scrollHeight);

 try{
   let res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_KEY}`,{
     method:"POST",
     headers:{"Content-Type":"application/json"},
     body: JSON.stringify({contents:[{parts:[{text: `You are Orbit Builder AI. User wants: "${p}". Reply with 3 bullet points what app you will build (like For You Feed, Chats). Keep it short, cool, in Sinhala mix English.`}]}]})
   });
   let data = await res.json();
   let aiText = data.candidates?.[0]?.content?.parts?.[0]?.text || "App eka hadanawa... For You Feed + Chat + Groups add kala!";

   document.getElementById('logs').innerHTML = "✓ AI connected!<br><br>" + aiText.replace(/\n/g,'<br>');
   document.getElementById('preview').style.display='block';
   document.getElementById('appName').innerText = p;
 }catch(e){
   // Key eka naththam fake AI wada karanawa
   document.getElementById('logs').innerHTML = "⚡ AI Demo Mode:<br>✓ For You Feed created<br>✓ Orbit Chat added<br>✓ Groups & Likes added<br><br>Real AI ona nam key eka danna! Free!";
   document.getElementById('preview').style.display='block';
   document.getElementById('appName').innerText = p;
 }
}
</script>
